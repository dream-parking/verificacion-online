spring.application.name=backend
server.port=${PORT:8080}
server.shutdown=graceful

# PostgreSQL. In Azure these come from Container Apps secrets (per environment).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/verificacion}
spring.datasource.username=${DB_USER:verificacion}
spring.datasource.password=${DB_PASSWORD:verificacion}
# Burstable B1ms has a small connection budget shared by dev + qa.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Tablas de dominio en el esquema ceiba (V2); flyway_schema_history sigue en public.
spring.jpa.properties.hibernate.default_schema=ceiba
spring.flyway.enabled=true
# Seguro por defecto (Prod): solo migraciones reales. Los datos demo (db/demo) se cargan con el perfil dev.
spring.flyway.locations=classpath:db/migration

# Probes used by Azure Container Apps (/actuator/health/liveness and /readiness)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.environment=${APP_ENV:local}
