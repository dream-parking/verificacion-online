name: webconsole-ci

on:
  pull_request:
    branches: [dev, QA, main]
  # Sin filtro de rutas en los PRs: estos checks son obligatorios y deben reportar siempre.
  # Sonar necesita analizar main (rama principal de Sonar) para tener la línea base.
  push:
    branches: [main]
    paths: ["webconsole/**", ".github/workflows/webconsole-*.yml"]

concurrency:
  group: webconsole-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webconsole
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar usa el historial para atribuir código nuevo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webconsole/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Si el Quality Gate falla, falla este paso. Sin SONAR_TOKEN (forks) se omite.
      - name: SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: webconsole
          args: -Dsonar.qualitygate.wait=true
