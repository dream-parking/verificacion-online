spring.application.name=backend
server.port=${PORT:8080}
server.shutdown=graceful

# PostgreSQL. In Azure these come from Container Apps secrets (per environment).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/verificacion}
spring.datasource.username=${DB_USER:verificacion}
spring.datasource.password=${DB_PASSWORD:verificacion}
# Burstable B1ms has a small connection budget shared by dev + qa.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Tablas de dominio y flyway_schema_history en public (V5 movió todo desde ceiba).
spring.flyway.enabled=true
# Seguro por defecto (Prod): solo migraciones reales. Los datos demo (db/demo) se cargan con el perfil dev.
spring.flyway.locations=classpath:db/migration
# dev-remote = dev + Flyway apagado (PC de desarrollo contra la base Dev, ver application-dev-remote.properties).
spring.profiles.group.dev-remote=dev

# Probes used by Azure Container Apps (/actuator/health/liveness and /readiness)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.environment=${APP_ENV:local}

# OpenAPI + Swagger UI. Apagado por defecto (Prod); el perfil dev lo enciende.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
