<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captura del DUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#9ddfa6}a:hover{color:#ffffff}
</style>
<style>
html,body{background:#e9ebee}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0;box-sizing:border-box}
.phone{width:390px;height:844px;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.18);flex:none}
</style>
</head>
<body>
<div class="phone">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1a1b1a; color: #ffffff; font-family: 'Open Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; flex: none">
    <a href="DatosBasicos.html" aria-label="Volver al paso anterior" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-size: 15px; font-weight: 700">Paso 2 de 5 · Tu DUI</span>
    <a href="#ayuda" aria-label="Ayuda para tomar la foto" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.4M12 17v.01"></path></svg></a>
  </div>
  <div style="display: flex; gap: 8px; padding: 4px 24px 0; flex: none">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <span style="height: 4px; border-radius: 2px; background: #9ddfa6"></span>
      <span style="font-size: 13px; font-weight: 700; color: #9ddfa6">1 · Frente</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
      <span style="height: 4px; border-radius: 2px; background: #4a4847"></span>
      <span style="font-size: 13px; font-weight: 600; color: #cccccc">2 · Reverso</span>
    </div>
  </div>
  <div style="padding: 26px 24px 0; flex: none">
    <h1 style="margin: 0; font-family: 'Nunito', sans-serif; font-size: 25px; line-height: 1.2; font-weight: 800; text-align: center">Coloca el frente de tu DUI dentro del marco</h1>
  </div>
  <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px">
    <div style="position: relative; width: 318px; height: 202px; border-radius: 14px; background: #2c2a29; box-shadow: 0 0 0 999px rgba(0,0,0,0.38)">
      <span style="position: absolute; left: -3px; top: -3px; width: 36px; height: 36px; border-left: 4px solid #9ddfa6; border-top: 4px solid #9ddfa6; border-top-left-radius: 16px"></span>
      <span style="position: absolute; right: -3px; top: -3px; width: 36px; height: 36px; border-right: 4px solid #9ddfa6; border-top: 4px solid #9ddfa6; border-top-right-radius: 16px"></span>
      <span style="position: absolute; left: -3px; bottom: -3px; width: 36px; height: 36px; border-left: 4px solid #9ddfa6; border-bottom: 4px solid #9ddfa6; border-bottom-left-radius: 16px"></span>
      <span style="position: absolute; right: -3px; bottom: -3px; width: 36px; height: 36px; border-right: 4px solid #9ddfa6; border-bottom: 4px solid #9ddfa6; border-bottom-right-radius: 16px"></span>
      <div style="position: absolute; inset: 22px; display: flex; gap: 16px; opacity: 0.55">
        <div style="width: 74px; height: 96px; border: 2px dashed #cccccc; border-radius: 6px; display: flex; align-items: center; justify-content: center">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#cccccc" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="9" r="3.5"></circle><path d="M5 20c1.2-3.3 3.8-5 7-5s5.8 1.7 7 5"></path></svg>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding-top: 4px">
          <span style="height: 8px; width: 90%; border-radius: 4px; background: #cccccc"></span>
          <span style="height: 8px; width: 70%; border-radius: 4px; background: #cccccc"></span>
          <span style="height: 8px; width: 80%; border-radius: 4px; background: #cccccc"></span>
          <span style="height: 8px; width: 55%; border-radius: 4px; background: #cccccc"></span>
        </div>
      </div>
    </div>
    <div role="status" style="display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 50px; background: #0a402b; font-size: 15px; font-weight: 700">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ddfa6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
      Bien, mantén el teléfono quieto
    </div>
  </div>
  <div style="display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 0 24px 22px; flex: none">
    <span style="padding: 6px 12px; border-radius: 50px; border: 1px solid #4a4847; font-size: 13px; color: #e8e8e8">Buena luz</span>
    <span style="padding: 6px 12px; border-radius: 50px; border: 1px solid #4a4847; font-size: 13px; color: #e8e8e8">Sin reflejos</span>
    <span style="padding: 6px 12px; border-radius: 50px; border: 1px solid #4a4847; font-size: 13px; color: #e8e8e8">Se ven las 4 esquinas</span>
  </div>
  <div style="display: flex; align-items: center; justify-content: center; padding: 0 0 36px; flex: none">
    <a href="DuiConfirmar.html" aria-label="Tomar la foto del frente" style="width: 78px; height: 78px; border-radius: 50%; border: 4px solid #ffffff; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
      <span style="width: 60px; height: 60px; border-radius: 50%; background: #9ddfa6"></span>
    </a>
  </div>
</div>
</div>
</body>
</html>
