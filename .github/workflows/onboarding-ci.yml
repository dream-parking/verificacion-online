name: onboarding-ci

on:
  pull_request:
    branches: [main, QA]
    paths: ["onboarding/**", ".github/workflows/onboarding-*.yml"]

concurrency:
  group: onboarding-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onboarding
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
