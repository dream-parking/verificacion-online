# Perfil dev-remote: la app corre en una PC de desarrollo contra la base Dev de Azure (DB_URL/DB_USER/DB_PASSWORD).
# Incluye el perfil dev (datos demo, Swagger) pero NO migra: las migraciones las aplica el despliegue de Azure.
# Con ddl-auto=validate, la app no arranca si el esquema de la base Dev no coincide con las entidades de tu rama.
spring.flyway.enabled=false
