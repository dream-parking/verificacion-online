name: webconsole-ci

on:
  pull_request:
    branches: [main, QA]
    paths: ["webconsole/**", ".github/workflows/webconsole-*.yml"]

concurrency:
  group: webconsole-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webconsole
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webconsole/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
