<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmar datos del DUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Nunito:wght@700;800&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#00448c}a:hover{color:#1e376e}
</style>
<style>
html,body{background:#e9ebee}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0;box-sizing:border-box}
.phone{width:390px;height:844px;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.18);flex:none}
</style>
</head>
<body>
<div class="phone">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #1a1b1a; font-family: 'Open Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 64px; display: flex; align-items: center; justify-content: center; gap: 10px; flex: none; position: relative">
    <a href="DuiCaptura.html" aria-label="Volver al paso anterior" style="position: absolute; left: 8px; top: 10px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a1b1a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <img src="../assets/emblem.png" alt="" style="width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 0 0 2px #9ddfa6">
    <div style="display: flex; flex-direction: column; line-height: 1">
      <span style="font-family: 'Cinzel', serif; font-size: 9px; font-weight: 600; letter-spacing: 0.32em; color: #0a402b">BANCO</span>
      <span style="font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700; color: #081b39">TANGAMANDAPIO</span>
    </div>
  </div>
  <div style="padding: 4px 24px 12px; display: flex; flex-direction: column; gap: 8px; flex: none">
    <span style="font-size: 16px; font-weight: 700; color: #5b5b5b">Paso 2 de 5</span>
    <div style="display: flex; gap: 6px">
      <span style="flex: 1; height: 6px; border-radius: 3px; background: #0a402b"></span>
      <span style="flex: 1; height: 6px; border-radius: 3px; background: #0a402b"></span>
      <span style="flex: 1; height: 6px; border-radius: 3px; background: #cccccc"></span>
      <span style="flex: 1; height: 6px; border-radius: 3px; background: #cccccc"></span>
      <span style="flex: 1; height: 6px; border-radius: 3px; background: #cccccc"></span>
    </div>
  </div>
  <div style="padding: 6px 24px 0; display: flex; flex-direction: column; gap: 14px; flex: 1 1 auto">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Nunito', sans-serif; font-size: 27px; line-height: 1.15; font-weight: 800; letter-spacing: -0.2px">¿Leímos bien tus datos?</h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: #5b5b5b">Los sacamos de las fotos de tu DUI. Corrige lo que no esté bien.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="position: relative; height: 92px; border-radius: 8px; background: #e3edf8; border: 1px solid #cccccc; overflow: hidden" role="img" aria-label="Foto del frente del DUI, legible">
            <div style="position: absolute; inset: 10px; display: flex; gap: 8px">
              <div style="width: 38px; height: 50px; border-radius: 4px; background: #b9c9db"></div>
              <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; padding-top: 3px">
                <span style="height: 5px; width: 90%; border-radius: 3px; background: #7d8fa6"></span>
                <span style="height: 5px; width: 70%; border-radius: 3px; background: #7d8fa6"></span>
                <span style="height: 5px; width: 80%; border-radius: 3px; background: #7d8fa6"></span>
              </div>
            </div>
            <span style="position: absolute; right: 6px; bottom: 6px; width: 22px; height: 22px; border-radius: 50%; background: #0a402b; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px">
            <span style="font-weight: 700">Frente</span>
            <a href="DuiCaptura.html" style="font-weight: 600; min-height: 24px; display: inline-flex; align-items: center">Repetir</a>
          </div>
        </div>
      
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="position: relative; height: 92px; border-radius: 8px; background: #e3edf8; border: 1px solid #cccccc; overflow: hidden" role="img" aria-label="Foto del reverso del DUI, legible">
            <div style="position: absolute; inset: 10px; display: flex; gap: 8px">
              
              <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; padding-top: 3px">
                <span style="height: 5px; width: 90%; border-radius: 3px; background: #7d8fa6"></span>
                <span style="height: 5px; width: 70%; border-radius: 3px; background: #7d8fa6"></span>
                <span style="height: 5px; width: 80%; border-radius: 3px; background: #7d8fa6"></span>
              </div>
            </div>
            <span style="position: absolute; right: 6px; bottom: 6px; width: 22px; height: 22px; border-radius: 50%; background: #0a402b; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px">
            <span style="font-weight: 700">Reverso</span>
            <a href="DuiCaptura.html" style="font-weight: 600; min-height: 24px; display: inline-flex; align-items: center">Repetir</a>
          </div>
        </div>
      
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      
        <div style="display: flex; flex-direction: column">
          <label for="o-dui" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #5b5b5b">Número de DUI</label>
          <input id="o-dui" value="04567891-2" style="border: 0; border-bottom: 1px solid #2c2a29; padding: 8px 0; font: inherit; font-size: 16px; color: #1a1b1a; outline: none; background: transparent">
          
        </div>
      
        <div style="display: flex; flex-direction: column">
          <label for="o-nom" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #5b5b5b">Nombres</label>
          <input id="o-nom" value="Marta Alejandra" style="border: 0; border-bottom: 1px solid #2c2a29; padding: 8px 0; font: inherit; font-size: 16px; color: #1a1b1a; outline: none; background: transparent">
          
        </div>
      
        <div style="display: flex; flex-direction: column">
          <label for="o-ape" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #5b5b5b">Apellidos</label>
          <input id="o-ape" value="Rivas Cruz" style="border: 0; border-bottom: 1px solid #2c2a29; padding: 8px 0; font: inherit; font-size: 16px; color: #1a1b1a; outline: none; background: transparent">
          
        </div>
      
        <div style="display: flex; flex-direction: column">
          <label for="o-nac" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #5b5b5b">Fecha de nacimiento</label>
          <input id="o-nac" value="14/03/1991" style="border: 0; border-bottom: 2px solid #7a4b00; padding: 8px 0; font: inherit; font-size: 16px; color: #1a1b1a; outline: none; background: transparent">
          
            <span style="display: flex; gap: 6px; align-items: center; padding-top: 5px; font-size: 13px; font-weight: 600; color: #7a4b00">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7a4b00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4.5M12 17.5v.01"></path></svg>
              No lo leímos con claridad. Revísalo.
            </span>
          
        </div>
      
        <div style="display: flex; flex-direction: column">
          <label for="o-ven" style="font-size: 13px; line-height: 18px; font-weight: 600; color: #5b5b5b">Vence el</label>
          <input id="o-ven" value="22/07/2031" style="border: 0; border-bottom: 1px solid #2c2a29; padding: 8px 0; font: inherit; font-size: 16px; color: #1a1b1a; outline: none; background: transparent">
          
        </div>
      
    </div>
  </div>
  <div style="padding: 12px 24px 26px; flex: none">
    <a href="#ingresos" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 50px; background: #9ddfa6; color: #1a1b1a; text-decoration: none; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.3px">Mis datos son correctos</a>
  </div>
</div>
</div>
</body>
</html>
