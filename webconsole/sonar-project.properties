sonar.host.url=https://sonarcloud.io
sonar.organization=alambritos-esen
sonar.projectKey=dream-parking_verificacion-online-webconsole
sonar.projectName=verificacion-online (webconsole)
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,.next/**,**/*.test.ts,**/*.test.tsx
# Cobertura de `npm run test:coverage` (Vitest). Mide src/lib y src/components; las pantallas (src/app) aún no tienen
# pruebas y por eso quedan fuera de la cobertura exigida por el Quality Gate. Quitar esta exclusión al probarlas.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/app/**
