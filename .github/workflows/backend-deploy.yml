name: backend-deploy

# dev -> Dev, QA -> QA. Image goes to GHCR (free), Azure Container Apps pulls it anonymously,
# so the package must be public. Azure login uses OIDC (no stored passwords).
# No tests here: pushes to dev/QA only arrive through PRs, and the required `test` check (ci.yml) already
# ran `./mvnw verify` on that same merge result. Docs and test-only changes don't trigger a deploy.
on:
  push:
    branches: [dev, QA]
    paths:
      - "backend/**"
      - "!backend/**/*.md"
      - "!backend/src/test/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/verificacion-online-backend
  APP_ENV: ${{ github.ref_name == 'dev' && 'dev' || 'qa' }}
  RESOURCE_GROUP: rg-verificaciononline

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'dev' && 'dev' || 'qa' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ env.APP_ENV }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image can be pulled anonymously
        run: |
          docker logout ghcr.io
          if ! docker manifest inspect "$IMAGE:${{ github.sha }}" > /dev/null 2>&1; then
            echo "::error::$IMAGE is private. Make the package public once: GitHub > dream-parking > Packages > verificacion-online-backend > Package settings > Change visibility > Public."
            exit 1
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            APP=ca-verificaciononline-api-${APP_ENV}
            az containerapp ingress update -n "$APP" -g "$RESOURCE_GROUP" --target-port 8080 -o none
            az containerapp update -n "$APP" -g "$RESOURCE_GROUP" \
              --image "$IMAGE:${{ github.sha }}" --set-env-vars APP_ENV="$APP_ENV" SPRING_PROFILES_ACTIVE=dev -o none
            FQDN=$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
            echo "FQDN=$FQDN" >> "$GITHUB_ENV"

      - name: Smoke test (scale-from-zero + Spring Boot startup can take ~1 min)
        run: |
          curl -fsS --retry 15 --retry-delay 10 --retry-all-errors --max-time 30 \
            "https://$FQDN/actuator/health/liveness"
