<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datos básicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Nunito:wght@700;800&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#00448c}a:hover{color:#1e376e}
input::placeholder{color:#6b6b6b}
</style>
<style>
html,body{background:#e9ebee}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0;box-sizing:border-box}
.phone{width:390px;height:844px;border-radius:36px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.18);flex:none}
</style>
</head>
<body>
<div class="phone">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #1a1b1a; font-family: 'Open Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 64px; display: flex; align-items: center; justify-content: center; gap: 10px; flex: none; position: relative">
    <a href="Ubicacion.html" aria-label="Volver al paso anterior" style="position: absolute; left: 8px; top: 10px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a1b1a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <img src="../assets/emblem.png" alt="" style="width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 0 0 2px #9ddfa6">
    <div style="display: flex; flex-direction: column; line-height: 1">
      <span style="font-family: 'Cinzel', serif; font-size: 9px; font-weight: 600; letter-spacing: 0.32em; color: #0a402b">BANCO</span>
      <span style="font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700; color: #081b39">TANGAMANDAPIO</span>
    </div>
  </div>
  <div style="padding: 4px 24px 14px; display: flex; flex-direction: column; gap: 8px; flex: none">
    <span style="font-size: 16px; font-weight: 700; color: #5b5b5b">Paso 1 de 5</span>
    <div style="display: flex; gap: 6px">
      <span style="flex: 1; height: 6px; border-radius: 3px; background: #0a402b"></span>
      <span style="flex: 1; height: 6px; border-radius: 3px; background: #cccccc"></span>
      <span style="flex: 1; height: 6px; border-radius: 3px; background: #cccccc"></span>
      <span style="flex: 1; height: 6px; border-radius: 3px; background: #cccccc"></span>
      <span style="flex: 1; height: 6px; border-radius: 3px; background: #cccccc"></span>
    </div>
  </div>
  <div style="padding: 10px 24px 0; display: flex; flex-direction: column; gap: 22px; flex: 1 1 auto">
    <h1 style="margin: 0; font-family: 'Nunito', sans-serif; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.2px">Cuéntanos quién eres</h1>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <label for="f-nombres" style="font-size: 14px; line-height: 20px; font-weight: 600; color: #5b5b5b">Nombres</label>
      <input id="f-nombres" value="Marta Alej@ndra" aria-invalid="true" aria-describedby="e-nombres" style="border: 0; border-bottom: 2px solid #8c1d18; padding: 12px 0; font: inherit; font-size: 16px; color: #1a1b1a; outline: none; background: transparent">
      <div id="e-nombres" style="display: flex; gap: 6px; align-items: flex-start; padding-top: 6px; font-size: 14px; line-height: 20px; font-weight: 600; color: #8c1d18">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8c1d18" stroke-width="2.2" stroke-linecap="round" style="flex: none; margin-top: 1px" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.01"></path></svg>
        <span>Escribe tus nombres solo con letras. También puedes usar espacios, apóstrofo (') o guion (-).</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <label for="f-apellidos" style="font-size: 14px; line-height: 20px; font-weight: 600; color: #5b5b5b">Apellidos</label>
      <input id="f-apellidos" value="Rivas-Cruz D'Aubuisson" style="border: 0; border-bottom: 1px solid #2c2a29; padding: 12px 0; font: inherit; font-size: 16px; color: #1a1b1a; outline: none; background: transparent">
      <span style="padding-top: 6px; font-size: 13px; color: #5b5b5b">Hasta 100 caracteres.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <label for="f-dui" style="font-size: 14px; line-height: 20px; font-weight: 600; color: #5b5b5b">Número de DUI</label>
      <input id="f-dui" value="04567891-2" inputmode="numeric" style="border: 0; border-bottom: 1px solid #2c2a29; padding: 12px 0; font: inherit; font-size: 16px; color: #1a1b1a; outline: none; background: transparent">
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <label for="f-cel" style="font-size: 14px; line-height: 20px; font-weight: 600; color: #5b5b5b">Teléfono celular</label>
      <input id="f-cel" value="7012-3456" inputmode="tel" style="border: 0; border-bottom: 1px solid #2c2a29; padding: 12px 0; font: inherit; font-size: 16px; color: #1a1b1a; outline: none; background: transparent">
    </div>
  </div>
  <div style="padding: 14px 24px 28px; display: flex; flex-direction: column; gap: 10px; flex: none">
    <div style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: #5b5b5b">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5b5b5b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M8 4v5h7V4M8 20v-6h8v6"></path></svg>
      Guardamos tu avance en cada paso.
    </div>
    <a href="DuiCaptura.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 50px; background: #9ddfa6; color: #1a1b1a; text-decoration: none; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.3px">Continuar</a>
  </div>
</div>
</div>
</body>
</html>
