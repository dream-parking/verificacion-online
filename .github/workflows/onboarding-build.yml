name: onboarding-build

# dev -> Dev build, QA -> QA build. Runs on Linux (Android only) to stay inside the
# free GitHub Actions minutes; macOS runners are billed at 10x.
# No analyze/test here: the required `analyze-test` check (ci.yml) already ran them in the PR.
# Docs, tests and iOS-only changes don't affect the APK, so they don't trigger a build.
on:
  push:
    branches: [dev, QA]
    paths:
      - "onboarding/**"
      - "!onboarding/**/*.md"
      - "!onboarding/test/**"
      - "!onboarding/ios/**"
      - ".github/workflows/onboarding-build.yml"
  workflow_dispatch:

concurrency:
  group: onboarding-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'dev' && 'dev' || 'qa' }}
    env:
      APP_ENV: ${{ github.ref_name == 'dev' && 'dev' || 'qa' }}
    defaults:
      run:
        working-directory: onboarding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            onboarding/android/*.gradle*
            onboarding/android/**/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=APP_ENV=$APP_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: onboarding-${{ env.APP_ENV }}-apk
          path: onboarding/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
