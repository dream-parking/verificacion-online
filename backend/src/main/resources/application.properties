spring.application.name=backend
server.port=${PORT:8080}
server.shutdown=graceful

# PostgreSQL. In Azure these come from Container Apps secrets (per environment).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/verificacion}
spring.datasource.username=${DB_USER:verificacion}
spring.datasource.password=${DB_PASSWORD:verificacion}
# Burstable B1ms has a small connection budget shared by dev + qa.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Hibernate no cachea por defecto el plan de las consultas Criteria (Specification): sin esto las traduce a SQL en cada petición.
spring.jpa.properties.hibernate.criteria.plan_cache_enabled=true
# Tablas de dominio y flyway_schema_history en public (V5 movió todo desde ceiba).
spring.flyway.enabled=true
# Seguro por defecto (Prod): solo migraciones reales. Los datos demo (db/demo) se cargan con el perfil dev.
spring.flyway.locations=classpath:db/migration
# dev-remote = dev + Flyway apagado (PC de desarrollo contra la base Dev, ver application-dev-remote.properties).
spring.profiles.group.dev-remote=dev

# Probes used by Azure Container Apps (/actuator/health/liveness and /readiness)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.environment=${APP_ENV:local}

# OpenAPI + Swagger UI. Apagado por defecto (Prod); el perfil dev lo enciende.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# CORS para la consola web (lista separada por comas). En Azure: APP_CORS_ALLOWED_ORIGINS con la URL de la consola de cada ambiente.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Detrás del proxy de Azure Container Apps: toma la IP real del cliente de X-Forwarded-For (solo de proxies internos de confianza).
server.forward-headers-strategy=native

# El ingress de Container Apps no comprime. La consola descarga el listado completo de solicitudes (~29 KB por página de 100),
# así que se comprime el JSON grande; las respuestas de la app móvil son menores a 2 KB y no se tocan.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json
server.compression.min-response-size=2KB

# Autenticación de la consola: JWT firmado con HS256. APP_JWT_SECRET (>= 32 caracteres) debe ser un secret de la Container App;
# si falta se genera uno aleatorio al arrancar (las sesiones no sobreviven a un reinicio) y se avisa en el log.
app.security.jwt-secret=${APP_JWT_SECRET:}
app.security.token-ttl=8h
# Primer administrador (opcional): si ambos están definidos y el correo no existe, se crea al arrancar. Nunca pisa una contraseña existente.
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# Ubicación aproximada de la sesión (VDI-67): el servidor consulta ip-api.com con la IP del cliente.
# El plan gratuito es solo HTTP, 45 consultas/min y uso no comercial; para producción usar el plan de pago
# (APP_GEOLOCATION_BASE_URL=https://pro.ip-api.com/json y APP_GEOLOCATION_QUERY=key=<clave>, esta como secret).
app.geolocation.enabled=${APP_GEOLOCATION_ENABLED:true}
app.geolocation.base-url=${APP_GEOLOCATION_BASE_URL:http://ip-api.com/json}
app.geolocation.query=${APP_GEOLOCATION_QUERY:}
app.geolocation.timeout=${APP_GEOLOCATION_TIMEOUT:2s}

# Paso del DUI (VDI-79): obligatorio. La app ya tiene la captura (VDI-77). Con false los ingresos saltan el paso y
# la solicitud se envía sin DUI (sin el rechazo por vencido ni sus señales de riesgo): solo para pruebas o uso local.
app.onboarding.identity-document-required=${APP_IDENTITY_DOCUMENT_REQUIRED:true}
# Fotos del DUI: hasta 5 MB cada una (frente y reverso en la misma petición).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB

# Lectura del DUI con un modelo de visión de OpenAI (Responses API, Structured Outputs, store=false). Sin
# APP_OCR_ENABLED=true y OPENAI_API_KEY (secret de la Container App) la lectura queda FAILED y la persona escribe
# sus datos a mano. El modelo se puede cambiar por uno más barato sin tocar el código.
app.ocr.enabled=${APP_OCR_ENABLED:false}
app.ocr.base-url=${APP_OCR_BASE_URL:https://api.openai.com/v1}
app.ocr.api-key=${OPENAI_API_KEY:}
app.ocr.model=${APP_OCR_MODEL:gpt-6-astra}
app.ocr.reasoning-effort=${APP_OCR_REASONING_EFFORT:low}
app.ocr.timeout=${APP_OCR_TIMEOUT:40s}

# Prueba de vida (VDI-114): el nivel de confianza (0 a 1) de la selfie. Proveedor `openai` (modelo de visión, misma
# OPENAI_API_KEY que el OCR; sin APP_LIVENESS_ENABLED=true la prueba queda FAILED y la solicitud sigue) o `simulated`
# (responde siempre app.liveness.simulated-confidence; solo para desarrollo, nunca en un ambiente real).
app.liveness.provider=${APP_LIVENESS_PROVIDER:openai}
app.liveness.enabled=${APP_LIVENESS_ENABLED:false}
app.liveness.base-url=${APP_LIVENESS_BASE_URL:https://api.openai.com/v1}
app.liveness.api-key=${OPENAI_API_KEY:}
app.liveness.model=${APP_LIVENESS_MODEL:gpt-6-astra}
app.liveness.reasoning-effort=${APP_LIVENESS_REASONING_EFFORT:low}
app.liveness.timeout=${APP_LIVENESS_TIMEOUT:40s}
app.liveness.simulated-confidence=${APP_LIVENESS_SIMULATED_CONFIDENCE:0.90}
# Con provider=simulated, un motivo (BLURRY, TOO_DARK, GLARE, FACE_NOT_VISIBLE, MULTIPLE_FACES u OTHER) hace que toda
# selfie responda 422 con ese motivo: sirve para probar en la app el flujo de «repetir la selfie».
app.liveness.simulated-problem=${APP_LIVENESS_SIMULATED_PROBLEM:}

# RNPN check (VDI-111): the confirmed DUI data is checked against the RNPN when the request is submitted. There is no
# public RNPN API, so the only provider is `simulated`, which answers by DUI number (see docs/rnpn.md). If the RNPN does
# not answer, it is retried app.rnpn.attempts times in total, waiting app.rnpn.retry-delay the first time and twice as
# long each time after that; then the request waits (AWAITING_RNPN) and is not approved automatically.
app.rnpn.provider=${APP_RNPN_PROVIDER:simulated}
app.rnpn.attempts=${APP_RNPN_ATTEMPTS:3}
app.rnpn.retry-delay=${APP_RNPN_RETRY_DELAY:500ms}
app.rnpn.simulated-no-match-duis=${APP_RNPN_SIMULATED_NO_MATCH_DUIS:00000020-4}
app.rnpn.simulated-unavailable-duis=${APP_RNPN_SIMULATED_UNAVAILABLE_DUIS:00000030-1}

# Electronic signature of the account contract (VDI-130, see docs/signature.md). app.contract.version picks the text in
# contracts/contrato-apertura-<version>.txt; its SHA-256 is stored with each signature. There is no signature provider
# yet, so the only one is `simulated`: it rejects the DUIs in app.signature.simulated-rejected-duis and signs the rest.
app.contract.version=${APP_CONTRACT_VERSION:2026.1}
app.signature.provider=${APP_SIGNATURE_PROVIDER:simulated}
app.signature.simulated-rejected-duis=${APP_SIGNATURE_SIMULATED_REJECTED_DUIS:00000040-8}

# Cifrado de las fotos del DUI (VDI-80): AES-256-GCM con APP_DOCUMENT_KEY (base64 de 32 bytes, secret de la
# Container App; generarla con `openssl rand -base64 32`). Sin ella la aplicación no arranca, salvo con el perfil
# dev, que usa una clave temporal: las fotos guardadas así no se pueden leer después de reiniciar.
# Cambiar la clave exige subir app.documents.key-version y volver a cifrar las fotos existentes.
app.documents.encryption-key=${APP_DOCUMENT_KEY:}
app.documents.key-version=1
