name: onboarding-build

# dev -> Dev build, QA -> QA build. Runs on Linux (Android only) to stay inside the
# free GitHub Actions minutes; macOS runners are billed at 10x.
on:
  push:
    branches: [dev, QA]
    paths: ["onboarding/**", ".github/workflows/onboarding-build.yml"]
  workflow_dispatch:

concurrency:
  group: onboarding-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'dev' && 'dev' || 'qa' }}
    env:
      APP_ENV: ${{ github.ref_name == 'dev' && 'dev' || 'qa' }}
    defaults:
      run:
        working-directory: onboarding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=APP_ENV=$APP_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: onboarding-${{ env.APP_ENV }}-apk
          path: onboarding/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
