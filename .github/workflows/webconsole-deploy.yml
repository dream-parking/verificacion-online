name: webconsole-deploy

# dev -> Dev, QA -> QA. Each GitHub Environment (dev / qa) holds its own
# AZURE_STATIC_WEB_APPS_API_TOKEN secret, pointing to a different Static Web App (Free plan).
on:
  push:
    branches: [dev, QA]
    paths:
      - "webconsole/**"
      - "!webconsole/**/*.md"
      - ".github/workflows/webconsole-deploy.yml"
  workflow_dispatch:

concurrency:
  group: webconsole-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'dev' && 'dev' || 'qa' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: webconsole
          api_location: ""
          output_location: ""
        env:
          NEXT_PUBLIC_APP_ENV: ${{ github.ref_name == 'dev' && 'dev' || 'qa' }}
